name: CI Pipeline

on:
  push:
    branches: [ main, "jules/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository integrity
        run: pnpm run check:integrity

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      - name: Build Next.js application
        run: pnpm run build
