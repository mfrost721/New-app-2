name: CI Pipeline

on:
  push:
    branches: [ main, "jules/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Run linter
        run: pnpm --config.verify-deps-before-run=false lint

      - name: Run unit tests
        run: pnpm --config.verify-deps-before-run=false test

      - name: Build Next.js application
        run: npm run build
